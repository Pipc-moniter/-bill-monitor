name: 법안 데이터 갱신

on:
  schedule:
    - cron: "17 21 * * *"   # 매일 오전 6시 17분(한국시간)
  workflow_dispatch:         # Actions 탭에서 수동 실행 가능
  push:
    paths:                   # 판단 기준·설정을 고치면 바로 재실행
      - "config/**"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: update-bills
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 수집 및 분류
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update.py

      - name: 결과 저장
        run: |
          git config user.name "bill-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push
          fi
