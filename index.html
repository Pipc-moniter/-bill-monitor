<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>알법 · 개인정보 입법동향 모니터링</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #1b1f24; --sub: #5b6470; --line: #e3e6ea;
    --accent: #1f5fbf; --accent-soft: #e8f0fb; --ok: #1d7a46; --warn: #a86400;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; font-size: 15px; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 60px; }
  header { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.02em; }
  header { align-items: center; }
  .brand { display: flex; align-items: center; gap: 20px; }
  .logo { display: flex; flex-direction: column; line-height: 1; text-align: center; font-family: "Gamja Flower", "Pretendard", cursive; }
  .logo .s { font-size: 19px; color: #5b8def; letter-spacing: .04em; }
  .logo .b { font-size: 52px; color: #1f5fbf; margin-top: 2px; }
  .logo .b em { font-style: normal; color: #ff8a5c; }
  .brand .bar { width: 1px; height: 52px; background: var(--line); }
  .titles .meta { margin-top: 4px; }
  @media (max-width: 760px) { .logo .b { font-size: 42px; } .brand { gap: 14px; } h1 { font-size: 18px; } }
  .meta { color: var(--sub); font-size: 13px; }
  .period-box { text-align: right; }
  .period { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 8px;
    padding: 6px 12px; font-size: 14px; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
  .period span { font-weight: 600; margin-right: 4px; }
  .period small { font-size: 13px; margin-left: 2px; }
  @media (max-width: 760px) { .period-box { text-align: left; } }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .stat b { display: block; font-size: 26px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--sub); font-size: 13px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .panel h2 { font-size: 15px; margin: 0 0 12px; }
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .charts .panel { margin-bottom: 0; }
  .charts .panel { display: flex; flex-direction: column; }
  .chart { margin-top: auto; }
  .chart svg { width: 100%; height: auto; display: block; overflow: visible; }
  .chart text { font-size: 11px; fill: var(--sub); }
  .chart .total { fill: #6b7785; }
  .chart .col:hover .seg, .chart .col:hover .total { opacity: .8; }
  .chart .hit { fill: transparent; cursor: default; }
  .panel-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 6px 12px; margin-bottom: 12px; }
  .panel-head h2 { margin: 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--sub); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  #tip { position: fixed; pointer-events: none; background: #1b1f24; color: #fff; font-size: 12px; line-height: 1.6;
    padding: 8px 10px; border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.18); display: none; z-index: 10; white-space: nowrap; }
  #tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
  .tier-summary { margin-top: auto; margin-bottom: auto; }
  .tier-summary .ts-total { font-size: 15px; color: var(--sub); margin-bottom: 14px; }
  .tier-summary .ts-total b { font-size: 30px; color: var(--ink); margin: 0 4px; font-variant-numeric: tabular-nums; }
  .ts-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; margin-bottom: 14px; }
  .ts-row .name { font-size: 14px; }
  .ts-row .name i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .ts-row .num { font-size: 14px; color: var(--sub); text-align: right; font-variant-numeric: tabular-nums; }
  .ts-row .num b { font-size: 18px; color: var(--ink); margin-right: 2px; }
  .ts-row .track { grid-column: 1 / -1; height: 8px; background: #eef0f3; border-radius: 4px; overflow: hidden; }
  .ts-row .fill { height: 100%; border-radius: 4px; }
  @media (max-width: 860px) { .charts { grid-template-columns: 1fr; } }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .filters input, .filters select { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font: inherit; background: #fff; }
  .filters input[type=search] { flex: 1; min-width: 220px; }
  .filters button { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 8px 12px; font: inherit; cursor: pointer; }
  .count { color: var(--sub); font-size: 13px; margin-left: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 13px; color: var(--sub); font-weight: 600; white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; color: var(--sub); }
  td.nowrap { white-space: nowrap; }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: #fafbfc; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #eef0f3; color: var(--sub); white-space: nowrap; }
  .badge.done { background: #e6f4ec; color: var(--ok); }
  .badge.pend { background: var(--accent-soft); color: var(--accent); }
  .tier { display: inline-block; min-width: 26px; text-align: center; font-size: 12px; font-weight: 700; padding: 2px 6px; border-radius: 6px; white-space: nowrap; }
  .tier.t1 { background: #e3eefb; color: #1c5aa6; }
  .tier.t2 { background: #fdeee6; color: #b4461b; }
  .tier.t3 { background: #e2f5ee; color: #12775a; }
  .tier.tM { background: #eef0f3; color: #5b6470; }
  .tag { font-size: 11px; color: var(--warn); margin-left: 4px; }
  tr.detail td { background: #fafbfc; color: var(--sub); font-size: 14px; }
  .pager { display: flex; justify-content: center; gap: 6px; margin-top: 14px; }
  .pager button { min-width: 34px; border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 6px 10px; cursor: pointer; font: inherit; }
  .pager button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .notice { font-size: 13px; color: var(--sub); line-height: 1.6; }
  .empty { text-align: center; color: var(--sub); padding: 40px 0; }
  @media (max-width: 760px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .hide-m { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo" aria-label="법 알리미 알법"><div class="s">법 알리미</div><div class="b">알<em>법</em></div></div>
      <div class="bar"></div>
      <div class="titles">
        <h1 id="title">개인정보 입법동향 모니터링</h1>
        <div class="meta">국회 의원발의 법률안 중 개인정보 관련 법안</div>
      </div>
    </div>
    <div class="period-box">
      <div class="period"><span>모니터링 기간</span> <b id="period">-</b> <small id="checked"></small></div>
      <div class="meta" id="updated">불러오는 중…</div>
    </div>
  </header>

  <section class="stats">
    <div class="stat"><span>관련 법안</span><b id="s-total">-</b></div>
    <div class="stat"><span>최근 30일 발의</span><b id="s-recent">-</b></div>
    <div class="stat"><span>계류 중</span><b id="s-pending">-</b></div>
    <div class="stat"><span>처리 완료</span><b id="s-done">-</b></div>
  </section>

  <div class="charts">
    <section class="panel">
      <div class="panel-head"><h2>월별 발의 추이</h2></div>
      <div id="chart" class="chart"></div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>구분별 현황</h2></div>
      <div id="tierSummary" class="tier-summary"></div>
    </section>
  </div>
  <div id="tip"></div>

  <section class="panel">
    <div class="filters">
      <input type="search" id="q" placeholder="의안명, 제안자, 의안번호 검색">
      <input type="date" id="from" aria-label="시작일">
      <span class="meta">~</span>
      <input type="date" id="to" aria-label="종료일">
      <select id="tierSel"><option value="">전체 구분</option><option value="1">구분 1 (개인정보 보호법)</option><option value="2">구분 2 (개인정보 수집 제공 등 처리 수반)</option><option value="3">구분 3 (개인정보위 정책상 검토 필요)</option></select>
      <select id="status"><option value="">전체 상태</option></select>
      <button id="reset">초기화</button>
      <span class="count" id="count"></span>
    </div>
    <table>
      <thead>
        <tr>
          <th class="num">연번</th>
          <th>구분</th>
          <th class="hide-m">의안번호</th>
          <th>의안명</th>
          <th class="hide-m">제안자</th>
          <th class="hide-m">대표발의</th>
          <th>제안일자</th>
          <th>심사진행상태</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="pager" id="pager"></div>
  </section>

  <p class="notice" id="notice">
    법안 행을 누르면 개인정보 관련으로 분류된 근거를 볼 수 있습니다.
    분류는 AI가 제안이유를 읽고 판단한 결과로, 담당자 검토 전의 참고 자료입니다.
  </p>
</div>

<script>
const PAGE = 50;
let ALL = [], VIEW = [], page = 1, openNo = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function load() {
  try {
    const res = await fetch("data/bills.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    ALL = data.bills || [];
    if (data.site_title) { $("title").textContent = data.site_title; document.title = "알법 · " + data.site_title; }
    // 모니터링 기간: 분류를 마친 법안의 발의일 범위 (예전 데이터 파일이면 관련 법안 날짜로 대신 표시)
    const dates = ALL.map((b) => b.date).filter(Boolean).sort();
    const pFrom = data.period_from || dates[0], pTo = data.period_to || dates[dates.length - 1];
    const dot = (d) => String(d).replaceAll("-", ".");
    $("period").textContent = pFrom ? `${dot(pFrom)} ~ ${dot(pTo)}` : "수집 전";
    const checked = data.checked ?? data.scanned;
    if (pFrom && checked) $("checked").textContent = `(총 ${Number(checked).toLocaleString()}건 검토)`;
    $("updated").textContent = data.updated_at
      ? `마지막 갱신 ${data.updated_at}`
      : "아직 수집된 데이터가 없습니다";
    if (data.pending > 0) {
      $("notice").innerHTML += ` <br>현재 AI 분류 대기 중인 법안이 ${Number(data.pending).toLocaleString()}건 있으며, 매일 순차적으로 반영됩니다.`;
    }
    initFilters();
    renderStats();
    renderChart();
    apply();
  } catch (e) {
    $("updated").textContent = "데이터를 불러오지 못했습니다";
    $("tbody").innerHTML = `<tr><td colspan="8" class="empty">data/bills.json을 읽을 수 없습니다.</td></tr>`;
  }
}

function initFilters() {
  const statuses = [...new Set(ALL.map((b) => b.status))].sort();
  $("status").innerHTML += statuses.map((s) => `<option>${esc(s)}</option>`).join("");
  ["q", "from", "to", "status", "tierSel"].forEach((id) => $(id).addEventListener("input", () => { page = 1; apply(); }));
  $("reset").addEventListener("click", () => {
    ["q", "from", "to", "status", "tierSel"].forEach((id) => ($(id).value = ""));
    page = 1; apply();
  });
}

function renderStats() {
  const cut = new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10);
  $("s-total").textContent = ALL.length.toLocaleString();
  $("s-recent").textContent = ALL.filter((b) => b.date >= cut).length.toLocaleString();
  $("s-pending").textContent = ALL.filter((b) => b.status === "계류").length.toLocaleString();
  $("s-done").textContent = ALL.filter((b) => b.status !== "계류").length.toLocaleString();
}

// 구분별 색: 표의 구분 배지와 같은 색을 쓴다
const TIER_COLORS = { "1": "#2a78d6", "2": "#eb6834", "3": "#1baf7a" };
const TIER_NAMES = { "1": "구분 1 (개인정보 보호법)", "2": "구분 2 (개인정보 수집 제공 등 처리 수반)", "3": "구분 3 (개인정보위 정책상 검토 필요)" };

function showTip(e, html) {
  const t = $("tip"); t.innerHTML = html; t.style.display = "block";
  const x = Math.min(e.clientX + 14, window.innerWidth - t.offsetWidth - 8);
  t.style.left = x + "px"; t.style.top = (e.clientY - t.offsetHeight - 10) + "px";
}
function hideTip() { $("tip").style.display = "none"; }
function bindTips(el, tips) {
  el.querySelectorAll(".col").forEach((g) => {
    g.addEventListener("mousemove", (e) => showTip(e, tips[g.dataset.i]));
    g.addEventListener("mouseleave", hideTip);
  });
}

function renderChart() {
  const counts = {};
  ALL.forEach((b) => {
    const m = (b.date || "").slice(0, 7); if (!m) return;
    counts[m] = (counts[m] || 0) + 1;
  });
  const months = Object.keys(counts).sort().slice(-12);
  if (!months.length) {
    $("chart").innerHTML = `<div class="empty">표시할 데이터가 없습니다</div>`; renderTierSummary(); return;
  }
  const W = 560, H = 190, padB = 22, padT = 18, plotH = H - padB - padT;
  const bw = W / months.length, barW = Math.min(bw * 0.6, 34);
  const label = (m) => m.slice(2).replace("-", ".");
  const every = Math.ceil(months.length / 6);

  // 왼쪽: 월별 전체
  const max1 = Math.max(...months.map((m) => counts[m]));
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="월별 발의 건수">`;
  const tips1 = [];
  months.forEach((m, i) => {
    const h = Math.max(2, (plotH * counts[m]) / max1), x = i * bw + (bw - barW) / 2, y = H - padB - h;
    tips1.push(`<b>${m.replace("-", "년 ")}월</b><br>관련 법안 ${counts[m]}건`);
    svg += `<g class="col" data-i="${i}"><rect class="hit" x="${i * bw}" y="0" width="${bw}" height="${H - padB}"/>
      <path class="total" d="${roundTop(x, y, barW, h)}"/>
      <text x="${x + barW / 2}" y="${y - 5}" text-anchor="middle">${counts[m]}</text></g>`;
    if (i % every === 0 || i === months.length - 1) svg += `<text x="${x + barW / 2}" y="${H - 5}" text-anchor="middle">${label(m)}</text>`;
  });
  $("chart").innerHTML = svg + `<line x1="0" x2="${W}" y1="${H - padB}" y2="${H - padB}" stroke="#e3e6ea"/></svg>`;
  bindTips($("chart"), tips1);

  renderTierSummary();
}

// 오른쪽: 구분별 현황 (총 ○건 중 구분별 건수)
function renderTierSummary() {
  const n = { "1": 0, "2": 0, "3": 0 };
  ALL.forEach((b) => { if (n[b.tier] !== undefined) n[b.tier]++; });
  const total = ALL.length;
  $("tierSummary").innerHTML = `<div class="ts-total">관련 법안 총<b>${total.toLocaleString()}</b>건 중</div>` +
    ["1", "2", "3"].map((t) => {
      const pct = total ? Math.round((n[t] / total) * 100) : 0;
      return `<div class="ts-row"><div class="name"><i style="background:${TIER_COLORS[t]}"></i>${TIER_NAMES[t]}</div>
        <div class="num"><b>${n[t].toLocaleString()}</b>건 (${pct}%)</div>
        <div class="track"><div class="fill" style="width:${pct}%;background:${TIER_COLORS[t]}"></div></div></div>`;
    }).join("");
}

// 위쪽 모서리만 둥근 막대
function roundTop(x, y, w, h) {
  const r = Math.min(4, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}

function apply() {
  const q = $("q").value.trim().toLowerCase();
  const from = $("from").value, to = $("to").value, st = $("status").value, tr = $("tierSel").value;
  VIEW = ALL.filter((b) =>
    (!q || [b.name, b.proposer, b.rep, b.no].some((v) => String(v).toLowerCase().includes(q))) &&
    (!from || b.date >= from) && (!to || b.date <= to) && (!st || b.status === st) && (!tr || b.tier === tr));
  $("count").textContent = `${VIEW.length.toLocaleString()}건`;
  renderTable();
}

const TIER = { "1": ["①", "구분 1 (개인정보 보호법)"], "2": ["②", "구분 2 (개인정보 수집 제공 등 처리 수반)"], "3": ["③", "구분 3 (개인정보위 정책상 검토 필요)"], "M": ["수동", "담당자 지정"] };
function tierBadge(t) {
  const v = TIER[t] || TIER["2"];
  return `<span class="tier t${esc(t || "2")}" title="${v[1]}">${v[0]}</span>`;
}

function renderTable() {
  const pages = Math.max(1, Math.ceil(VIEW.length / PAGE));
  page = Math.min(page, pages);
  const start = (page - 1) * PAGE;
  const rows = VIEW.slice(start, start + PAGE);
  if (!rows.length) {
    $("tbody").innerHTML = `<tr><td colspan="8" class="empty">조건에 맞는 법안이 없습니다</td></tr>`;
  } else {
    $("tbody").innerHTML = rows.map((b, i) => {
      const badge = b.status === "계류" ? "pend" : "done";
      const tag = b.source === "manual" ? `<span class="tag">수동 지정</span>` : b.title_only ? `<span class="tag">제목 기준</span>` : "";
      let html = `<tr class="row" data-no="${esc(b.no)}">
        <td class="num">${start + i + 1}</td>
        <td>${tierBadge(b.tier)}</td>
        <td class="hide-m nowrap">${esc(b.no)}</td>
        <td><a href="${esc(b.link)}" target="_blank" rel="noopener">${esc(b.name)}</a>${tag}</td>
        <td class="hide-m">${esc(b.proposer)}</td>
        <td class="hide-m nowrap">${esc(b.rep)}</td>
        <td class="nowrap">${esc(b.date)}</td>
        <td><span class="badge ${badge}">${esc(b.status)}</span></td></tr>`;
      if (openNo === b.no) {
        html += `<tr class="detail"><td></td><td colspan="7"><b>분류 근거</b> ${esc(b.reason || "-")}${b.committee ? `<br><b>소관위원회</b> ${esc(b.committee)}` : ""}</td></tr>`;
      }
      return html;
    }).join("");
  }
  document.querySelectorAll("tr.row").forEach((tr) => tr.addEventListener("click", (e) => {
    if (e.target.closest("a")) return;
    openNo = openNo === tr.dataset.no ? null : tr.dataset.no;
    renderTable();
  }));
  renderPager(pages);
}

function renderPager(pages) {
  if (pages <= 1) { $("pager").innerHTML = ""; return; }
  const lo = Math.max(1, page - 4), hi = Math.min(pages, lo + 8);
  let html = page > 1 ? `<button data-p="${page - 1}">‹</button>` : "";
  for (let p = lo; p <= hi; p++) html += `<button data-p="${p}" class="${p === page ? "on" : ""}">${p}</button>`;
  if (page < pages) html += `<button data-p="${page + 1}">›</button>`;
  $("pager").innerHTML = html;
  $("pager").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
    page = Number(b.dataset.p); renderTable(); window.scrollTo({ top: $("q").offsetTop - 20, behavior: "smooth" });
  }));
}

load();
</script>
</body>
</html>
